name: Deploy API to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_API_SERVICE }}
  TRANSLATION_WORKER_JOB: ${{ vars.CLOUD_RUN_TRANSLATION_WORKER_JOB }}
  CRAWLER_WORKER_JOB: ${{ vars.CLOUD_RUN_CRAWLER_WORKER_JOB }}
  SCHOOL_CRAWLER_JOB: ${{ vars.CLOUD_RUN_SCHOOL_CRAWLER_JOB }}
  CONTENT_EXTRACTOR_JOB: ${{ vars.CLOUD_RUN_CONTENT_EXTRACTOR_JOB }}
  IMAGE_NAME: naranhi-api

jobs:
  deploy:
    name: Build and deploy API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate
        run: python -m compileall backend/app

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA" \
            --tag "$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars: |
            ENVIRONMENT=production
            SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            CORS_ORIGINS=https://naranhi-web-140086900496.asia-northeast3.run.app
            VERTEX_AI_PROJECT_ID=${{ vars.VERTEX_AI_PROJECT_ID }}
            VERTEX_AI_LOCATION=${{ vars.VERTEX_AI_LOCATION }}
            WORKER_TRIGGER_ENABLED=true
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            GCP_REGION=${{ env.REGION }}
            TRANSLATION_WORKER_JOB_NAME=${{ env.TRANSLATION_WORKER_JOB }}
            CRAWLER_WORKER_JOB_NAME=${{ env.CRAWLER_WORKER_JOB }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest
            GEMINI_API_KEY=gemini-api-key:latest
            CRAWLER_INTERNAL_TOKEN=crawler-internal-token:latest
            NEIS_API_KEY=neis-api-key:latest
          flags: >-
            --allow-unauthenticated
            --port=8080
            --timeout=300
            --memory=512Mi
            --cpu=1
            --no-cpu-throttling

      # 워커는 상시가동 Service(min-instances=1, $120/월 유휴)가 아니라 Cloud Run Job으로
      # 배포한다. enqueue 시 run.jobs.run 트리거(+백스톱 Scheduler)로만 깨운다.
      # 같은 이미지를 쓰고 command/args만 워커 모듈로 바꾼다. --max-jobs 0 = 큐가 빌 때까지 drain.
      - name: Deploy translation worker Job to Cloud Run
        if: ${{ env.TRANSLATION_WORKER_JOB != '' }}
        run: |
          gcloud run jobs deploy "$TRANSLATION_WORKER_JOB" \
            --image="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --command=python \
            --args="-m,app.jobs.translation_worker,--max-jobs,0,--idle-grace-seconds,3,--batch-size,8" \
            --task-timeout=3600 \
            --max-retries=1 \
            --memory=512Mi \
            --cpu=1 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO,SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},VERTEX_AI_PROJECT_ID=${{ vars.VERTEX_AI_PROJECT_ID }},VERTEX_AI_LOCATION=${{ vars.VERTEX_AI_LOCATION }},GEMINI_MAX_CONCURRENCY=32" \
            --set-secrets="SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,GEMINI_API_KEY=gemini-api-key:latest,CRAWLER_INTERNAL_TOKEN=crawler-internal-token:latest,NEIS_API_KEY=neis-api-key:latest"

      - name: Deploy crawler worker Job to Cloud Run
        if: ${{ env.CRAWLER_WORKER_JOB != '' }}
        run: |
          gcloud run jobs deploy "$CRAWLER_WORKER_JOB" \
            --image="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --command=python \
            --args="-m,app.jobs.crawler_worker,--max-jobs,0,--idle-grace-seconds,3" \
            --task-timeout=3600 \
            --max-retries=1 \
            --memory=512Mi \
            --cpu=1 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO,SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},VERTEX_AI_PROJECT_ID=${{ vars.VERTEX_AI_PROJECT_ID }},VERTEX_AI_LOCATION=${{ vars.VERTEX_AI_LOCATION }}" \
            --set-secrets="SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,GEMINI_API_KEY=gemini-api-key:latest,CRAWLER_INTERNAL_TOKEN=crawler-internal-token:latest,NEIS_API_KEY=neis-api-key:latest"

      # 정기 배치: 매일 06/18시 Cloud Scheduler가 직접 깨우는 전체학교 크롤 + 본문추출 Job.
      # 큐(app_jobs) 미사용 — Scheduler가 jobs:run으로 직접 실행. CRAWLER_SCHEDULE_NOTICE_COUNT=게시판 스캔 깊이.
      - name: Deploy scheduled school crawler Job to Cloud Run
        if: ${{ env.SCHOOL_CRAWLER_JOB != '' }}
        run: |
          gcloud run jobs deploy "$SCHOOL_CRAWLER_JOB" \
            --image="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --command=python \
            --args="-m,app.jobs.scheduled_school_crawler" \
            --task-timeout=14400 \
            --max-retries=0 \
            --memory=512Mi \
            --cpu=1 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO,SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},VERTEX_AI_PROJECT_ID=${{ vars.VERTEX_AI_PROJECT_ID }},VERTEX_AI_LOCATION=${{ vars.VERTEX_AI_LOCATION }},CRAWLER_SCHEDULE_NOTICE_COUNT=8" \
            --set-secrets="SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,GEMINI_API_KEY=gemini-api-key:latest,CRAWLER_INTERNAL_TOKEN=crawler-internal-token:latest,NEIS_API_KEY=neis-api-key:latest"

      - name: Deploy scheduled content extractor Job to Cloud Run
        if: ${{ env.CONTENT_EXTRACTOR_JOB != '' }}
        run: |
          gcloud run jobs deploy "$CONTENT_EXTRACTOR_JOB" \
            --image="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --command=python \
            --args="-m,app.jobs.scheduled_content_extractor,--max-notices,30" \
            --task-timeout=14400 \
            --max-retries=0 \
            --memory=512Mi \
            --cpu=1 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO,SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},VERTEX_AI_PROJECT_ID=${{ vars.VERTEX_AI_PROJECT_ID }},VERTEX_AI_LOCATION=${{ vars.VERTEX_AI_LOCATION }}" \
            --set-secrets="SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,GEMINI_API_KEY=gemini-api-key:latest,CRAWLER_INTERNAL_TOKEN=crawler-internal-token:latest,NEIS_API_KEY=neis-api-key:latest"
