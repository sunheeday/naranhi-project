services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    env_file:
      - .env.local
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env.local
